configuration:
  ollama_url:
    name: Ollama URL
    description: Adres van de Ollama-server, bijv. http://192.168.1.10:11434
  model:
    name: Taalmodel
    description: Ollama-model voor gesprekken en het aansturen van het huis (moet tool-calling ondersteunen)
  vision_model:
    name: Beeldmodel
    description: Ollama-model voor camerabeelden (vision)
  context_size:
    name: Contextgrootte
    description: Aantal tokens context (num_ctx). Hoger kost meer VRAM.
  keep_alive:
    name: Keep alive
    description: Hoe lang Ollama het model in het geheugen houdt na gebruik
  think:
    name: Denkmodus
    description: Laat het model eerst "nadenken" (trager, soms nauwkeuriger)
  language:
    name: Taal
  dry_run:
    name: Testmodus (dry-run)
    description: Acties worden alleen gelogd, niet echt uitgevoerd
  only_exposed_entities:
    name: Alleen blootgestelde entiteiten
    description: Beperk de AI tot entiteiten die in Assist zijn blootgesteld
  confirm_domains:
    name: Bevestiging vereist
    description: Domeinen waarvoor je acties eerst moet bevestigen
  deny_domains:
    name: Verboden domeinen
    description: Domeinen waarvan de AI nooit services mag aanroepen
  deny_services:
    name: Verboden services
    description: Specifieke services die de AI nooit mag aanroepen (domein.service)
  max_tool_calls:
    name: Max. tool-aanroepen
    description: Maximaal aantal tool-aanroepen per vraag
  notify_service:
    name: Meldingsservice
    description: Bijv. notify.mobile_app_telefoon. Leeg = meldingen in Home Assistant zelf.
  proactive:
    name: Proactief
    description: De AI houdt het huis in de gaten en waarschuwt zelf
  camera_alerts:
    name: Camera-meldingen
    description: Bij detectie (persoon/voertuig/bel) het camerabeeld laten beoordelen - off, away (alleen als niemand thuis is) of always
  open_window_minutes:
    name: Raam open + verwarming (min.)
    description: Waarschuw als een raam/deur zo lang open staat terwijl de verwarming aan staat
  unlocked_away_minutes:
    name: Onbeveiligd terwijl weg (min.)
    description: Waarschuw als een slot open of garagedeur open staat terwijl niemand thuis is
  daily_summary_time:
    name: Dagelijkse samenvatting
    description: Tijdstip (HH:MM) voor de ochtendsamenvatting. Leeg = uit.
  quiet_hours:
    name: Stille uren
    description: Geen niet-kritieke pushmeldingen in deze periode, bijv. 23:00-07:00
  routine_learning:
    name: Routines leren
    description: Herken terugkerende handmatige acties en stel automatiseringen voor
  tts_entity:
    name: TTS-entiteit
    description: Bijv. tts.piper. Nodig om meldingen uit te spreken.
  announce_players:
    name: Speakers voor aankondigingen
    description: media_player-entiteiten waarop de deurbel en alarmen worden uitgesproken
  autonomous:
    name: Autonome agent
    description: De AI houdt het huis zelf in de gaten (hartslag, incidenten, opvolging)
  autonomy:
    name: Autonomie per domein
    description: "domein=niveau. observe = alleen kijken, shadow = vastleggen zonder uitvoeren, ask = vragen met knop, act = zelf doen (omkeerbaar, met ongedaan maken)"
  kill_switch:
    name: Noodknop
    description: input_boolean die zelfstandig handelen aan/uit zet (wordt automatisch aangemaakt). Uit = alleen melden.
  max_climate_change:
    name: Max. temperatuurwijziging
    description: Hoeveel graden de AI zelf mag bijstellen
  max_autonomous_actions_per_hour:
    name: Max. eigen acties per uur
  triage_model:
    name: Triage-model
    description: Klein, snel model voor de hartslag (bijv. qwen3:4b-instruct). Leeg = taalmodel.
  heartbeat_minutes:
    name: Hartslag (min.)
    description: Hoe vaak de agent rondkijkt
  sleep_hours:
    name: Slaaptijden
    description: Periode voor huismodus 'slapen', bijv. 23:00-07:00
  camera_profiles:
    name: Camera's
    description: "camera=type. door = voordeur (alleen rondhangen melden), private = achtertuin/privé (elke persoon, kritiek met alarm aan), street = straat (alleen verdacht), off = negeren, auto = op naam"
  camera_patrol:
    name: Camerapatrouille
    description: Regelmatig camerabeelden vergelijken - off, away (als niemand thuis is of iedereen slaapt) of always
  patrol_minutes:
    name: Patrouille-interval (min.)
  snapshot_retention_days:
    name: Snapshots bewaren (dagen)
  autonomous_scenes:
    name: Scènes/scripts die de agent zelf mag starten
  override_minutes:
    name: Na handmatige aanpassing afblijven (minuten)
  comfort:
    name: Comfortprofielen uitvoeren
  preheat_distance_km:
    name: Voorverwarmen vanaf afstand (km)
  leak_valve:
    name: Hoofdkraan dicht bij lekkage
  emergency_lights:
    name: Alle lampen aan bij rook/gas/CO
  emergency_fans_off:
    name: Ventilatie uit bij rook
  person_notify:
    name: Telefoon per persoon
    description: "person.naam=notify.mobile_app_telefoon"
  digest_time:
    name: Avondoverzicht (UU:MM)
  llm_down_minutes:
    name: Melden als de AI-server onbereikbaar is na (minuten)
  api_key:
    name: API-sleutel
    description: Voor de Assist-integratie. Leeg = automatisch gegenereerd.
  log_level:
    name: Logniveau
