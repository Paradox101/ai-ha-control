configuration:
  ollama_url:
    name: Ollama URL
    description: Address of the Ollama server, e.g. http://192.168.1.10:11434
  model:
    name: Language model
    description: Ollama model used for chat and home control (must support tool calling)
  vision_model:
    name: Vision model
    description: Ollama model used to analyse camera images
  context_size:
    name: Context size
    description: Context window in tokens (num_ctx). Higher uses more VRAM.
  keep_alive:
    name: Keep alive
    description: How long Ollama keeps the model loaded after use
  think:
    name: Thinking mode
    description: Let the model reason first (slower, sometimes more accurate)
  language:
    name: Language
  dry_run:
    name: Dry run
    description: Actions are only logged, never executed
  only_exposed_entities:
    name: Only exposed entities
    description: Restrict the AI to entities exposed to Assist
  confirm_domains:
    name: Confirmation required
    description: Domains whose actions you must confirm first
  deny_domains:
    name: Denied domains
    description: Domains whose services the AI may never call
  deny_services:
    name: Denied services
    description: Specific services the AI may never call (domain.service)
  max_tool_calls:
    name: Max tool calls
    description: Maximum number of tool calls per request
  notify_service:
    name: Notify service
    description: E.g. notify.mobile_app_phone. Empty = Home Assistant persistent notifications.
  proactive:
    name: Proactive
    description: Let the AI watch the house and warn you by itself
  camera_alerts:
    name: Camera alerts
    description: On detection (person/vehicle/doorbell) let the AI look at the camera - off, away (only when nobody is home) or always
  open_window_minutes:
    name: Window open + heating (min)
    description: Warn when a window/door is open this long while heating is on
  unlocked_away_minutes:
    name: Unsecured while away (min)
    description: Warn when a lock is unlocked or the garage is open while nobody is home
  daily_summary_time:
    name: Daily summary
    description: Time (HH:MM) for the morning summary. Empty = off.
  quiet_hours:
    name: Quiet hours
    description: No non-critical push notifications in this period, e.g. 23:00-07:00
  routine_learning:
    name: Learn routines
    description: Detect repeated manual actions and suggest automations
  tts_entity:
    name: TTS entity
    description: E.g. tts.piper. Needed to speak announcements.
  announce_players:
    name: Announcement speakers
    description: media_player entities on which doorbell and alarms are announced
  autonomous:
    name: Autonomous agent
    description: The AI watches the house by itself (heartbeat, incidents, follow-ups)
  autonomy:
    name: Autonomy per domain
    description: "domain=level. observe = watch only, shadow = record without doing, ask = ask with a button, act = do it (reversible, with undo)"
  kill_switch:
    name: Kill switch
    description: input_boolean that enables acting on its own (created automatically). Off = notify only.
  max_climate_change:
    name: Max temperature change
    description: How many degrees the AI may change by itself
  max_autonomous_actions_per_hour:
    name: Max own actions per hour
  triage_model:
    name: Triage model
    description: Small fast model for the heartbeat (e.g. qwen3:4b-instruct). Empty = language model.
  heartbeat_minutes:
    name: Heartbeat (min)
    description: How often the agent looks around
  sleep_hours:
    name: Sleep hours
    description: Period for house mode 'sleeping', e.g. 23:00-07:00
  camera_patrol:
    name: Camera patrol
    description: Regularly compare camera images - off, away (when nobody is home or everyone sleeps) or always
  patrol_minutes:
    name: Patrol interval (min)
  snapshot_retention_days:
    name: Keep snapshots (days)
  autonomous_scenes:
    name: Scenes/scripts the agent may start by itself
  override_minutes:
    name: Keep hands off after a manual change (minutes)
  comfort:
    name: Run comfort profiles
  preheat_distance_km:
    name: Preheat from distance (km)
  leak_valve:
    name: Close main valve on a leak
  emergency_lights:
    name: All lights on for smoke/gas/CO
  emergency_fans_off:
    name: Ventilation off for smoke
  person_notify:
    name: Phone per person
    description: "person.name=notify.mobile_app_phone"
  digest_time:
    name: Evening digest (HH:MM)
  llm_down_minutes:
    name: Report an unreachable AI server after (minutes)
  api_key:
    name: API key
    description: Used by the Assist integration. Empty = generated automatically.
  log_level:
    name: Log level
