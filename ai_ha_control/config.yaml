name: AI HA Control
version: "0.6.21"
slug: ai_ha_control
description: Lokale AI (Ollama) die je huis helpt beheren via Home Assistant
url: https://github.com/paradox101/ai-ha-control
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
discovery:
  - ai_ha_control
ingress: true
ingress_port: 8099
watchdog: http://[HOST]:[PORT:8099]/api/health
backup: hot
backup_pre: /usr/bin/ai-ha-backup
backup_exclude:
  - "snapshots"
  - "ai_ha_control.db"
  - "ai_ha_control.db-wal"
  - "ai_ha_control.db-shm"
  - "*.tmp"
panel_icon: mdi:robot-happy
panel_title: AI Huis
options:
  ollama_url: "http://192.168.1.10:11434"
  model: "qwen3:8b"
  vision_model: "qwen3-vl:4b"
  context_size: 12288
  keep_alive: "30m"
  think: false
  language: "nl"
  dry_run: true
  only_exposed_entities: false
  confirm_domains:
    - lock
    - alarm_control_panel
    - cover
    - valve
  deny_domains:
    - shell_command
    - hassio
    - recorder
    - python_script
  deny_services:
    - homeassistant.restart
    - homeassistant.stop
    - homeassistant.reload_all
  max_tool_calls: 8
  notify_service: ""
  proactive: true
  camera_alerts: away
  open_window_minutes: 10
  unlocked_away_minutes: 15
  daily_summary_time: "07:30"
  quiet_hours: "23:00-07:00"
  routine_learning: true
  tts_entity: ""
  announce_players: []
  autonomous: true
  autonomy:
    - light=act
    - climate=act
    - fan=act
    - switch=ask
    - media_player=ask
    - cover=ask
    - lock=ask
    - alarm_control_panel=ask
    - valve=ask
  kill_switch: input_boolean.ai_autonoom
  max_climate_change: 2.0
  max_autonomous_actions_per_hour: 10
  triage_model: ""
  heartbeat_minutes: 10
  sleep_hours: "23:00-07:00"
  camera_patrol: away
  camera_profiles: []
  patrol_minutes: 15
  snapshot_retention_days: 7
  autonomous_scenes: []
  override_minutes: 120
  comfort: true
  preheat_distance_km: 15
  outdoor_sensor: ""
  ventilation_entity: ""
  shade_max_wind: 25
  mode_entity: ""
  presence_extra: []
  leak_valve: ""
  emergency_lights: true
  emergency_fans_off: []
  person_notify: []
  digest_time: ""
  llm_down_minutes: 30
  escalate_minutes: 5
  bedtime_check: true
  appliance_alerts: true
  appliance_quiet: []
  leak_flow_hours: 2
  health_report: true
  offline_ignore_areas:
    - Server
  offline_house_only: true
  presence_simulation: false
  calendar_context: true
  energy_context: true
  api_key: ""
  log_level: info
schema:
  ollama_url: url
  model: str
  vision_model: str
  context_size: int(2048,131072)
  keep_alive: str
  think: bool
  language: list(nl|en)
  dry_run: bool
  only_exposed_entities: bool
  confirm_domains:
    - str
  deny_domains:
    - str
  deny_services:
    - str
  max_tool_calls: int(1,30)
  notify_service: str?
  proactive: bool
  camera_alerts: list(off|away|always)
  open_window_minutes: int(1,240)
  unlocked_away_minutes: int(1,240)
  daily_summary_time: str?
  quiet_hours: str?
  routine_learning: bool
  tts_entity: str?
  announce_players:
    - str
  autonomous: bool
  autonomy:
    - match(^[a-z_]+=(observe|shadow|ask|act)$)
  kill_switch: str?
  max_climate_change: float(0,10)
  max_autonomous_actions_per_hour: int(0,100)
  triage_model: str?
  heartbeat_minutes: int(1,120)
  sleep_hours: str?
  camera_patrol: list(off|away|always)
  camera_profiles:
    - match(^camera\.[a-z0-9_]+=(auto|door|private|street|off)$)
  patrol_minutes: int(5,240)
  snapshot_retention_days: int(1,90)
  autonomous_scenes:
    - str
  override_minutes: int(0,1440)
  comfort: bool
  preheat_distance_km: float(1,100)
  outdoor_sensor: str?
  ventilation_entity: str?
  shade_max_wind: float(0,150)
  mode_entity: str?
  presence_extra:
    - str
  leak_valve: str?
  emergency_lights: bool
  emergency_fans_off:
    - str
  person_notify:
    - match(^person\.[a-z0-9_]+=[a-z_]+\.[a-z0-9_]+$)
  digest_time: str?
  llm_down_minutes: int(5,1440)
  escalate_minutes: int(0,60)
  bedtime_check: bool
  appliance_alerts: bool
  appliance_quiet:
    - str
  leak_flow_hours: float(0,24)
  health_report: bool
  offline_ignore_areas:
    - str
  offline_house_only: bool
  presence_simulation: bool
  calendar_context: bool
  energy_context: bool
  api_key: password?
  log_level: list(debug|info|warning|error)
