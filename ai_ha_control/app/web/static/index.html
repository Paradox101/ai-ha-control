<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Huis</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1c1f24; --muted: #6b7280;
    --accent: #03a9f4; --user: #e1f3fd; --border: #e2e5ea; --warn: #fff4d6; --warn-b: #f0c14b;
    --ok: #16a34a; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --panel: #1c1f23; --text: #e6e8eb; --muted: #9aa1ab;
      --user: #0b3a52; --border: #2c3036; --warn: #3a2f12; --warn-b: #a07c1c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .pill.warn { color: var(--warn-b); border-color: var(--warn-b); }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 4px 10px;
               border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.active { border-color: var(--border); color: var(--text); background: var(--bg); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  #chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 90px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word;
         background: var(--panel); border: 1px solid var(--border); }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg.error { border-color: var(--bad); color: var(--bad); }
  details { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details pre { white-space: pre-wrap; margin: 4px 0; }
  .confirm { background: var(--warn); border: 1px solid var(--warn-b); border-radius: 10px; padding: 10px 14px; }
  .confirm button { margin: 6px 6px 0 0; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border);
         padding: 12px 16px; }
  form .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
                     background: var(--bg); color: var(--text); font: inherit; min-width: 0; }
  button.primary, .confirm button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                                    padding: 8px 16px; cursor: pointer; font: inherit; }
  .confirm button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .hidden { display: none; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>🤖 AI Huis</h1>
  <span id="ha" class="pill">HA …</span>
  <span id="llm" class="pill">Ollama …</span>
  <span id="dry" class="pill warn hidden">testmodus</span>
  <nav>
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="log">Actielog</button>
  </nav>
</header>
<main>
  <section id="tab-chat">
    <div id="chat"></div>
  </section>
  <section id="tab-log" class="hidden">
    <table><thead><tr><th>Tijd</th><th>Actie</th><th>Status</th><th>Resultaat</th></tr></thead>
      <tbody id="log"></tbody></table>
  </section>
</main>
<form id="form">
  <div class="inner">
    <input id="input" type="text" placeholder="Vraag of opdracht, bijv. 'Welke ramen staan open?'" autocomplete="off">
    <button class="primary" id="send">Stuur</button>
  </div>
</form>
<script>
  // Relative URLs so the page works behind Home Assistant Ingress.
  const api = (path, opts) => fetch(path, opts).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  });
  const $ = id => document.getElementById(id);
  let conversationId = null;
  try { conversationId = sessionStorage.getItem("conv"); } catch (e) {}

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function addMessage(text, cls) {
    const m = el("div", "msg " + (cls || ""), text);
    $("chat").appendChild(m);
    window.scrollTo(0, document.body.scrollHeight);
    return m;
  }

  function addPending(p) {
    if (document.getElementById("p-" + p.id)) return;
    const box = el("div", "confirm");
    box.id = "p-" + p.id;
    box.appendChild(el("div", "", "⚠️ Bevestiging nodig: " + p.description));
    box.appendChild(el("div", "", p.reason));
    const yes = el("button", "", "Uitvoeren");
    const no = el("button", "secondary", "Annuleren");
    const decide = async (decision) => {
      yes.disabled = no.disabled = true;
      try {
        const r = await api(`api/pending/${p.id}/${decision}`, { method: "POST" });
        box.appendChild(el("div", "", decision === "confirm"
          ? (r.status === "ok" ? "✅ Uitgevoerd" : r.status === "dry_run" ? "🧪 " + r.message : "❌ " + (r.error || r.status))
          : "Geannuleerd"));
      } catch (e) { box.appendChild(el("div", "", "❌ " + e.message)); }
    };
    yes.onclick = () => decide("confirm");
    no.onclick = () => decide("reject");
    box.append(yes, no);
    $("chat").appendChild(box);
  }

  $("form").onsubmit = async (ev) => {
    ev.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    $("input").value = "";
    $("send").disabled = true;
    addMessage(text, "user");
    const typing = addMessage("Bezig…", "typing");
    try {
      const r = await api("api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation_id: conversationId }),
      });
      conversationId = r.conversation_id;
      try { sessionStorage.setItem("conv", conversationId); } catch (e) {}
      typing.remove();
      const m = addMessage(r.answer);
      if (r.actions && r.actions.length) {
        const d = el("details");
        d.appendChild(el("summary", "", `${r.actions.length} tool-aanroep(en)`));
        for (const a of r.actions) d.appendChild(el("pre", "", `${a.tool}(${JSON.stringify(a.arguments)})\n→ ${a.result}`));
        m.appendChild(d);
      }
      (r.pending || []).forEach(addPending);
    } catch (e) {
      typing.remove();
      addMessage("Fout: " + e.message, "error");
    } finally {
      $("send").disabled = false;
      $("input").focus();
    }
  };

  async function refreshStatus() {
    try {
      const s = await api("api/status");
      const ha = s.home_assistant;
      $("ha").textContent = ha.connected ? `HA ✓ ${ha.entities} entiteiten` : "HA niet verbonden";
      $("ha").className = "pill " + (ha.connected ? "ok" : "bad");
      const o = s.ollama;
      let txt = "Ollama onbereikbaar", cls = "bad";
      if (o.reachable) {
        txt = `${o.model}${o.model_installed ? "" : " (niet geïnstalleerd!)"}`;
        cls = o.model_installed ? "ok" : "warn";
      }
      $("llm").textContent = txt;
      $("llm").className = "pill " + cls;
      $("dry").classList.toggle("hidden", !s.dry_run);
    } catch (e) {}
  }

  async function refreshLog() {
    const rows = await api("api/audit?limit=200");
    const body = $("log");
    body.replaceChildren();
    for (const r of rows) {
      const tr = el("tr");
      const a = r.arguments;
      const what = a.domain ? `${a.domain}.${a.service} ${(a.entity_ids || []).join(", ")} ${a.data && Object.keys(a.data).length ? JSON.stringify(a.data) : ""}`
                            : `${r.action} ${JSON.stringify(a)}`;
      tr.append(el("td", "", new Date(r.ts * 1000).toLocaleString("nl-NL")), el("td", "", what),
                el("td", "", r.decision), el("td", "", r.result || ""));
      body.appendChild(tr);
    }
  }

  document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
    $("tab-chat").classList.toggle("hidden", b.dataset.tab !== "chat");
    $("tab-log").classList.toggle("hidden", b.dataset.tab !== "log");
    $("form").classList.toggle("hidden", b.dataset.tab !== "chat");
    if (b.dataset.tab === "log") refreshLog();
  });

  api("api/pending").then(list => list.forEach(addPending)).catch(() => {});
  refreshStatus();
  setInterval(refreshStatus, 15000);
  $("input").focus();
</script>
</body>
</html>
