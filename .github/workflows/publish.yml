name: Publish images

# Builds the add-on for every architecture and pushes it to GitHub Container Registry, so Home Assistant
# can download a ready image instead of building it on the device. Enable `image:` in config.yaml once
# the packages exist and are public.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version and base image
        id: meta
        run: |
          echo "version=$(grep '^version:' ai_ha_control/config.yaml | tr -d '\"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "base=$(grep '${{ matrix.arch }}:' ai_ha_control/build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "platform=$([ '${{ matrix.arch }}' = aarch64 ] && echo linux/arm64 || echo linux/amd64)" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ai_ha_control
          platforms: ${{ steps.meta.outputs.platform }}
          build-args: BUILD_FROM=${{ steps.meta.outputs.base }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.arch }}-addon-ai_ha_control:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.arch }}-addon-ai_ha_control:latest
